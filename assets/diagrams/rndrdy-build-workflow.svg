<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d">
  <title id="t">How RNDRDY is built</title>
  <desc id="d">A product owner agent writes feature specs into an Obsidian vault. A dev agent in Claude Code implements, tests and opens a pull request. I review each one with a separate Claude session as second opinion. Quality gates with production tests close each release stage. Findings feed the next spec. Nick sets priorities and approves every step.</desc>
  <style>
    .me{fill:#16201C}
    .agent{fill:#E8EEFA;stroke:#1F5FBF;stroke-width:1.75}
    .box{fill:#fff;stroke:#16201C;stroke-width:1.5}
    .hw{font:600 15px "Helvetica Neue",Arial,sans-serif;fill:#fff}
    .ha{font:600 16px "Helvetica Neue",Arial,sans-serif;fill:#173F86}
    .h{font:600 16px "Helvetica Neue",Arial,sans-serif;fill:#16201C}
    .n{font:700 13px "Helvetica Neue",Arial,sans-serif;fill:#1F5FBF}
    .s{font:400 13.5px "Helvetica Neue",Arial,sans-serif;fill:#4A5550}
    .l{font:500 12.5px "Helvetica Neue",Arial,sans-serif;fill:#5B6660}
    .ln{stroke:#16201C;stroke-width:1.5;fill:none}
    .lnd{stroke:#8A948D;stroke-width:1.25;fill:none;stroke-dasharray:5 4}
    .tick{stroke:#16201C;stroke-width:1.25;stroke-dasharray:2 3}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16201C"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A948D"/></marker>
  </defs>

  <rect class="me" x="30" y="24" width="900" height="44" rx="8"/>
  <text class="hw" x="480" y="51" text-anchor="middle">Me: priorities, product decisions, approval of every step</text>
  <path class="tick" d="M130 68V110M370 68V110M610 68V110M850 68V110"/>

  <rect class="agent" x="30" y="110" width="200" height="120" rx="10"/>
  <text class="n" x="48" y="138">1</text>
  <text class="ha" x="48" y="160">Product owner agent</text>
  <text class="s" x="48" y="184">Turns decisions into</text>
  <text class="s" x="48" y="202">specs and architecture</text>
  <text class="s" x="48" y="220">records in Obsidian</text>

  <path class="ln" d="M230 170H264" marker-end="url(#a)"/>

  <rect class="agent" x="270" y="110" width="200" height="120" rx="10"/>
  <text class="n" x="288" y="138">2</text>
  <text class="ha" x="288" y="160">Dev agent</text>
  <text class="s" x="288" y="184">Claude Code implements,</text>
  <text class="s" x="288" y="202">writes tests, opens a pull</text>
  <text class="s" x="288" y="220">request with preview</text>

  <path class="ln" d="M470 170H504" marker-end="url(#a)"/>

  <rect class="agent" x="510" y="110" width="200" height="120" rx="10"/>
  <text class="n" x="528" y="138">3</text>
  <text class="ha" x="528" y="160">Review</text>
  <text class="s" x="528" y="184">I review each pull request</text>
  <text class="s" x="528" y="202">with a separate Claude</text>
  <text class="s" x="528" y="220">session as second opinion</text>

  <path class="ln" d="M710 170H744" marker-end="url(#a)"/>

  <rect class="box" x="750" y="110" width="180" height="120" rx="10"/>
  <text class="n" x="768" y="138">4</text>
  <text class="h" x="768" y="160">Quality gate</text>
  <text class="s" x="768" y="184">Production test</text>
  <text class="s" x="768" y="202">before the next</text>
  <text class="s" x="768" y="220">release stage</text>

  <path class="lnd" d="M840 230V290H130V236" marker-end="url(#ag)"/>
  <text class="l" x="485" y="310" text-anchor="middle">Findings from review and tests become the next spec</text>
</svg>
