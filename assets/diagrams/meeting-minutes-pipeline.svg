<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">Meeting minutes pipeline</title>
  <desc id="d">Three inputs feed the pipeline on the Mac: iPhone voice memos synced via iCloud, screen recordings from OBS, and older recordings dropped into an iCloud Drive folder. A background service detects new files, Whisper transcribes them locally, an exchangeable language model summarises them into structured data, and a client check accepts a client only with a verbatim quote found in the transcript or file name. With evidence the minutes go to the client folder, then to a PDF and an email. Without evidence they go to an inbox, where setting the client field later moves them to the client folder.</desc>
  <style>
    .box{fill:#fff;stroke:#16201C;stroke-width:1.5}
    .app{fill:#E8EEFA;stroke:#1F5FBF;stroke-width:1.75}
    .rev{fill:#F1F3EF;stroke:#16201C;stroke-width:1.5;stroke-dasharray:5 4}
    .mac{fill:none;stroke:#8A948D;stroke-width:1.25;stroke-dasharray:6 4}
    .h{font:600 16px "Helvetica Neue",Arial,sans-serif;fill:#16201C}
    .ha{font:600 16px "Helvetica Neue",Arial,sans-serif;fill:#173F86}
    .s{font:400 13px "Helvetica Neue",Arial,sans-serif;fill:#4A5550}
    .l{font:600 12.5px "Helvetica Neue",Arial,sans-serif;fill:#5B6660}
    .ln{stroke:#16201C;stroke-width:1.5;fill:none}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16201C"/></marker>
  </defs>

  <!-- Inputs -->
  <text class="l" x="20" y="38">Inputs</text>
  <rect class="box" x="20" y="50" width="170" height="80" rx="10"/>
  <text class="h" x="36" y="80">Voice memo</text>
  <text class="s" x="36" y="102">iPhone, via iCloud</text>

  <rect class="box" x="20" y="150" width="170" height="80" rx="10"/>
  <text class="h" x="36" y="180">Screen recording</text>
  <text class="s" x="36" y="202">OBS, saved as .mov</text>

  <rect class="box" x="20" y="250" width="170" height="80" rx="10"/>
  <text class="h" x="36" y="280">Older recording</text>
  <text class="s" x="36" y="302">Shared to a folder</text>

  <path class="ln" d="M190 90H208M190 190H208M190 290H208M208 90V290"/>
  <path class="ln" d="M208 105H236" marker-end="url(#a)"/>

  <!-- Mac region -->
  <rect class="mac" x="222" y="20" width="724" height="425" rx="14"/>
  <text class="l" x="240" y="430">On the Mac. Only the transcript reaches the chosen model.</text>

  <!-- Row 1 -->
  <rect class="box" x="240" y="60" width="150" height="90" rx="10"/>
  <text class="h" x="256" y="90">1 Detect</text>
  <text class="s" x="256" y="112">File trigger plus</text>
  <text class="s" x="256" y="130">10-minute fallback</text>

  <rect class="app" x="410" y="60" width="150" height="90" rx="10"/>
  <text class="ha" x="426" y="90">2 Transcribe</text>
  <text class="s" x="426" y="112">Whisper, local GPU</text>
  <text class="s" x="426" y="130">Audio stays local</text>

  <rect class="app" x="580" y="60" width="160" height="90" rx="10"/>
  <text class="ha" x="596" y="90">3 Summarise</text>
  <text class="s" x="596" y="112">Exchangeable LLM</text>
  <text class="s" x="596" y="130">Structured JSON</text>

  <rect class="box" x="760" y="60" width="160" height="90" rx="10"/>
  <text class="h" x="776" y="90">4 Client check</text>
  <text class="s" x="776" y="112">Quote required,</text>
  <text class="s" x="776" y="130">verified in code</text>

  <path class="ln" d="M390 105H404" marker-end="url(#a)"/>
  <path class="ln" d="M560 105H574" marker-end="url(#a)"/>
  <path class="ln" d="M740 105H754" marker-end="url(#a)"/>

  <!-- Row 2 -->
  <rect class="box" x="760" y="240" width="160" height="80" rx="10"/>
  <text class="h" x="776" y="270">Client folder</text>
  <text class="s" x="776" y="292">Obsidian vault</text>

  <rect class="box" x="580" y="240" width="160" height="80" rx="10"/>
  <text class="h" x="596" y="270">5 PDF export</text>
  <text class="s" x="596" y="292">Client documents</text>

  <rect class="box" x="410" y="240" width="150" height="80" rx="10"/>
  <text class="h" x="426" y="270">6 Email</text>
  <text class="s" x="426" y="292">PDF to my inbox</text>

  <path class="ln" d="M810 150V234" marker-end="url(#a)"/>
  <text class="l" x="820" y="200">evidence</text>
  <path class="ln" d="M760 280H746" marker-end="url(#a)"/>
  <path class="ln" d="M580 280H566" marker-end="url(#a)"/>

  <!-- Inbox -->
  <rect class="rev" x="760" y="345" width="160" height="70" rx="10"/>
  <text class="h" x="776" y="373">Inbox</text>
  <text class="s" x="776" y="395">Set client field later</text>

  <path class="ln" d="M920 105H938V380H926" marker-end="url(#a)"/>
  <text class="l" x="930" y="300" text-anchor="end" transform="rotate(-90 930 300)">no evidence</text>
  <path class="ln" d="M870 345V326" marker-end="url(#a)"/>
</svg>
